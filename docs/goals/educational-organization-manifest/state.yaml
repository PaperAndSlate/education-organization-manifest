# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts.

version: 2

goal:
  title: "Educational Organization Manifest Repository"
  slug: "educational-organization-manifest"
  kind: existing_plan
  tranche: "Continuous execution of the complete EOM repository described by the approved planning pack until the full local outcome is complete and external gates are explicitly packaged as blocked where necessary."
  status: active
  oracle:
    signal: "The remediation audit maps every implementable master-prompt and phase requirement to current repository artifacts and executable evidence; RC3 release, post-remediation security, and local aggregate verification are current; unavailable external gates remain explicitly blocked."
    cadence: "after each Worker package, at phase boundaries, and at final audit"
    final_proof: "A final Judge or PM receipt records full_outcome_complete: true and cites the traceability matrix, phase reports, verification output, generated-drift result, conformance result, and external-gate status."
  intake:
    original_request: "/goal follow the prompt in MASTER_CODEX_GOAL_PROMPT.txt until this entire project is complete"
    interpreted_outcome: "Implement, test, document, and release-prepare the complete paper&slate Educational Organization Manifest repository specified by the master prompt and every planning document."
    input_shape: existing_plan
    audience: "Protocol maintainers, educational organizations, publishers, and machine-readable data consumers"
    authority: requested
    proof_type: artifact
    completion_proof: "Every implementable v1 deliverable is present, traceable, locally verified, drift-free, and externally blocked work is explicitly packaged without false claims."
    likely_misfire: "Stopping at a scaffold or documentation-only repository without executable schemas, generator, validation, privacy/SSRF enforcement, conformance tests, or release evidence."
    blind_spots_considered:
      - "The current directory is a planning-only bootstrap with no source tree or Git metadata."
      - "Planning documents can conflict; priority order and confirmed decisions govern."
      - "IANA approval, independent pilots, provider acceptance, credentials, and production deployment are external gates and cannot be invented."
      - "Generated artifacts, module coverage, safety fixtures, provenance/conflict semantics, and documentation/playground acceptance need explicit evidence."
      - "No destructive cleanup, push, merge, deployment, live or paid call is authorized."
    existing_plan_facts:
      - "Read and index every planning file before changing code."
      - "Create a requirement traceability matrix before implementation."
      - "Implement in delivery/PHASES_AND_MILESTONES.md order and create a report after each phase."
      - "Use JSON Schema 2020-12 as the structural source of truth and do not hand-edit generated artifacts."
      - "Implement the root manifest, all required v1 modules, generator, validator/linter, CLI, integrity/signature design, conformance suite, docs/playground, Ecme High example, governance, adapters, agentic workflow, and CI/release assets."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_requested
    url: null
    command: "node C:/Users/Callum/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/educational-organization-manifest"

