name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.17.0', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize Git settings
        run: |
          git config --local core.autocrlf false
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.6.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: Hosted validation
        run: pnpm verify:hosted
      - name: Upload hosted-validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: eom-ci-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            coverage/
            playwright-report/
            test-results/
            reports/verification/traceability-result.json
          if-no-files-found: ignore
          retention-days: 14
