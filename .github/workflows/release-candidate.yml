name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize Git settings
        run: |
          git config --local core.autocrlf false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Install Linux browser dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Verify hosted workflow policy
        run: pnpm workflow:check
      - name: Verify candidate
        run: pnpm verify
      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eom-release-candidate-evidence
          path: |
            release/
            reports/
          if-no-files-found: error
          retention-days: 30
