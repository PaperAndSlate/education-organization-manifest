name: Protocol or schema proposal
description: Propose a core field, module, profile, semantic rule, version change, or registry action.
title: 'proposal: '
labels: ['type:rfc']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use cases
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, security, internationalization, accessibility, and provenance impact
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Traceability requirement(s)
    validations:
      required: true
